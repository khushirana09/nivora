<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f2ec">
    <title>Nivora — your AI mentor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f1f2fb;
            --card: rgba(255, 255, 255, .72);
            --ink: #1b2144;
            --mute: #5d6486;
            --acc: #5b4ee8;
            --acc2: #2bb8a8;
            --line: rgba(27, 33, 68, .1);
            --g: radial-gradient(900px 500px at 0% -10%, #d9d4ff, transparent), radial-gradient(700px 500px at 100% 0%, #c9f1ec, transparent);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1330;
                --card: rgba(255, 255, 255, .07);
                --ink: #eceeff;
                --mute: #9aa1c9;
                --acc: #8f84ff;
                --acc2: #52d6c6;
                --line: rgba(255, 255, 255, .12);
                --g: radial-gradient(900px 500px at 0% -10%, #2a2470, transparent), radial-gradient(700px 500px at 100% 0%, #0f4b53, transparent)
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1330;
            --card: rgba(255, 255, 255, .07);
            --ink: #eceeff;
            --mute: #9aa1c9;
            --acc: #8f84ff;
            --acc2: #52d6c6;
            --line: rgba(255, 255, 255, .12);
            --g: radial-gradient(900px 500px at 0% -10%, #2a2470, transparent), radial-gradient(700px 500px at 100% 0%, #0f4b53, transparent)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: var(--g);
            background-attachment: fixed;
            color: var(--ink);
            font: 16px/1.55 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh
        }

        main {
            max-width: 1080px;
            margin: auto;
            padding: 20px clamp(14px, 4vw, 32px) 110px
        }

        h1 {
            font-size: clamp(1.7rem, 4.5vw, 2.6rem);
            line-height: 1.1;
            margin: .2em 0 .3em;
            font-weight: 700;
            letter-spacing: -.02em
        }

        h2 {
            font-size: 1.1rem;
            margin: 0 0 10px
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 16px;
            margin: 14px 0
        }

        .mute {
            color: var(--mute)
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .sp {
            justify-content: space-between
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        .btn {
            background: var(--acc);
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 600
        }

        .btn.alt {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--acc2);
            outline-offset: 2px
        }

        input,
        select {
            font: inherit;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 12px;
            width: 100%
        }

        .bar {
            height: 10px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--acc), var(--acc2));
            transition: width .5s
        }

        .task {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--line)
        }

        .task:first-of-type {
            border-top: 0
        }

        .chk {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--acc);
            background: none;
            flex: none
        }

        .done .chk {
            background: var(--acc2);
            border-color: var(--acc2)
        }

        .done b {
            text-decoration: line-through;
            opacity: .55
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid var(--line)
        }

        nav button {
            flex: 1;
            max-width: 110px;
            background: none;
            border: 0;
            border-radius: 14px;
            padding: 8px 4px;
            color: var(--mute);
            font-size: .82rem
        }

        nav button[aria-current=true] {
            color: var(--acc);
            background: var(--line);
            font-weight: 600
        }

        .orb {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 20px auto;
            border: 0;
            background: radial-gradient(circle at 35% 30%, #fff9, transparent 40%), linear-gradient(135deg, var(--acc), var(--acc2));
            box-shadow: 0 0 60px var(--acc);
            color: #fff;
            font-weight: 700;
            font-size: 1rem
        }

        .orb.on {
            animation: p 1.2s ease-in-out infinite
        }

        @keyframes p {
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 100px var(--acc2)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .orb.on {
                animation: none
            }
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            margin: 8px 0;
            white-space: pre-wrap
        }

        .me {
            margin-left: auto;
            background: var(--acc);
            color: #fff
        }

        .ai {
            background: var(--card);
            border: 1px solid var(--line)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: .88rem
        }

        .big {
            font-size: 3.4rem;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums
        }

        .step {
            padding: 8px 0 8px 18px;
            border-left: 3px solid var(--acc2);
            margin-left: 6px
        }

        .step.d {
            border-color: var(--acc)
        }

        .sw {
            display: flex;
            gap: 8px;
            align-items: center
        }

        h1,
        h2,
        .big,
        .orb,
        nav button,
        .brand {
            font-family: 'DM Sans', 'DM Sans', system-ui, sans-serif
        }

        .btn,
        .me,
        .chip[aria-pressed=true] {
            color: var(--onacc, #fff)
        }

        .chip[aria-pressed=true] {
            background: var(--acc);
            border-color: var(--acc)
        }

        .sw {
            flex-wrap: wrap
        }

        .swb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            padding: 0
        }

        .swb[aria-pressed=true] {
            border-color: var(--ink)
        }

        .cols {
            display: grid;
            gap: 0 16px
        }

        .cols>.btn {
            grid-column: 1/-1
        }

        .brand {
            display: none;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--acc);
            padding: 6px 14px 18px
        }

        label.mute {
            display: block;
            margin: 10px 0 4px;
            font-size: .9rem
        }

        @media(min-width:760px) {
            .cols {
                grid-template-columns: 1fr 1fr;
                align-items: start
            }
        }

        @media(min-width:900px) {
            nav {
                left: 0;
                right: auto;
                top: 0;
                bottom: 0;
                width: 220px;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                padding: 24px 14px;
                border-top: 0;
                border-right: 1px solid var(--line)
            }

            nav button {
                max-width: none;
                flex: none;
                text-align: left;
                padding: 12px 14px;
                font-size: .95rem
            }

            .brand {
                display: block
            }

            main {
                margin-left: 220px;
                max-width: none;
                padding: 32px 40px
            }

            .wrap {
                max-width: 980px;
                margin: auto
            }
        }

        .t-mentor,
        .t-goals,
        .t-focus,
        .t-settings {
            max-width: 720px
        }

        @media(max-width:400px) {
            nav button {
                font-size: .68rem;
                padding: 8px 1px
            }
        }

        .wrap {
            margin-inline: auto;
            width: 100%
        }

        .btn {
            white-space: nowrap
        }

        .t-mentor,
        .t-focus {
            text-align: center
        }

        .t-mentor .msg {
            text-align: left
        }

        .t-mentor h1 {
            margin-top: 0
        }

        .orbwrap {
            position: relative;
            display: grid;
            place-items: center;
            height: 250px
        }

        .orb {
            display: grid;
            place-items: center;
            margin: 0;
            width: 160px;
            height: 160px;
            position: relative;
            z-index: 1
        }

        .ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 1.5px solid var(--acc);
            opacity: .3
        }

        .r1 {
            transform: scale(1.4)
        }

        .r2 {
            transform: scale(1.8);
            opacity: .15
        }

        .orbwrap.on .ring {
            animation: rg 2.6s ease-out infinite
        }

        .orbwrap.on .r2 {
            animation-delay: 1.3s
        }

        @keyframes rg {
            from {
                transform: scale(1);
                opacity: .5
            }

            to {
                transform: scale(2.1);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .orbwrap.on .ring {
                animation: none
            }
        }

        .status {
            color: var(--mute);
            margin: 0 0 14px
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 14px;
            min-height: 130px;
            max-height: 320px;
            overflow: auto;
            margin: 0 0 14px;
            text-align: left
        }

        .tf {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px
        }

        .tf input:first-child {
            flex: 1 1 100%
        }

        .tf input[type=time],
        .tf input[type=number] {
            width: auto;
            flex: 1 1 90px
        }

        .ringbox {
            position: relative;
            width: min(260px, 70vw);
            margin: 14px auto
        }

        .ringbox svg {
            width: 100%;
            display: block
        }

        .trk {
            fill: none;
            stroke: var(--line);
            stroke-width: 12
        }

        .prg {
            fill: none;
            stroke: url(#gr);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear
        }

        .ringtxt {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            font: 700 clamp(2.4rem, 9vw, 3.3rem) 'DM Sans', sans-serif;
            font-variant-numeric: tabular-nums
        }

        .ringtxt small {
            font: 500 .85rem 'DM Sans', sans-serif;
            color: var(--mute)
        }

        .stat {
            text-align: center;
            display: grid
        }

        .stat b {
            font: 700 2.2rem 'DM Sans', sans-serif;
            color: var(--acc)
        }

        .giant {
            display: block;
            width: 100%;
            padding: 28px 20px;
            font: 700 clamp(1.2rem, 4vw, 1.6rem) 'DM Sans', sans-serif;
            border-radius: 28px;
            margin: 18px 0;
            box-shadow: 0 16px 44px -14px var(--acc)
        }

        .move {
            border-color: var(--acc)
        }

        .mv {
            font: 700 clamp(1.25rem, 3.6vw, 1.6rem)/1.3 'DM Sans', sans-serif;
            margin: 6px 0
        }

        .tf select,
        .tf input[type=date] {
            width: auto;
            flex: 1 1 110px
        }

        .fab {
            position: fixed;
            right: 16px;
            bottom: calc(84px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            display: flex;
            gap: 8px;
            align-items: center;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            color: var(--onacc, #fff);
            font: 700 1rem 'DM Sans', sans-serif;
            box-shadow: 0 12px 30px -8px var(--acc)
        }

        [hidden] {
            display: none !important
        }

        @media(min-width:900px) {
            .fab {
                bottom: 28px;
                right: 32px
            }
        }

        .t-me .cols {
            margin-top: 0
        }

        .gpath {
            padding: 14px 0;
            border-top: 1px solid var(--line)
        }

        .gpath:first-of-type {
            border-top: 0
        }

        .path {
            list-style: none;
            margin: 10px 0;
            padding: 0;
            text-align: left
        }

        .path li {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 0
        }

        .path li:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 12px;
            top: 30px;
            bottom: -9px;
            width: 2px;
            background: var(--line)
        }

        .path .dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--acc);
            background: var(--bg);
            padding: 0;
            flex: none;
            position: relative;
            z-index: 1;
            display: block
        }

        .path span {
            flex: 1
        }

        .path .d .dot {
            background: var(--acc2);
            border-color: var(--acc2)
        }

        .path .d span {
            opacity: .55;
            text-decoration: line-through
        }

        .path .c .dot {
            background: var(--acc);
            box-shadow: 0 0 0 5px var(--line)
        }

        .path em {
            font-style: normal;
            font-size: .8rem;
            font-weight: 700;
            color: var(--acc)
        }

        .path .fin {
            color: var(--mute);
            font-family: 'DM Sans', sans-serif
        }

        textarea {
            font: inherit;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 12px;
            width: 100%;
            resize: vertical
        }

        .fcard {
            border-color: var(--acc)
        }

        .fq {
            font: 600 1.1rem/1.45 'DM Sans', sans-serif;
            margin: 8px 0
        }

        .fgrid {
            gap: 0 24px;
            margin-top: 6px
        }

        .fgrid h3 {
            font: 700 .95rem 'DM Sans', sans-serif;
            color: var(--acc);
            margin: 14px 0 4px
        }

        .fit {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-top: 1px solid var(--line)
        }

        .fm {
            color: var(--acc);
            font-weight: 600;
            margin: 6px 0
        }

        .chain {
            list-style: none;
            margin: 10px 0;
            padding: 0;
            text-align: left
        }

        .chain li {
            position: relative;
            padding: 0 0 8px 20px
        }

        .chain li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: .5em;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--acc)
        }

        .chain li:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 1.4em;
            bottom: -.2em;
            width: 2px;
            background: var(--line)
        }

        .chain small {
            color: var(--mute);
            margin-right: 6px
        }

        .chain li:last-child {
            font-weight: 700
        }

        .t-focus .chain {
            display: inline-block
        }

        .path .ms {
            margin-left: 36px;
            padding: 4px 0
        }

        .path .ms::before {
            display: none
        }

        .path .ms .dot {
            width: 18px;
            height: 18px
        }

        .tf select#tl {
            flex: 1 1 100%
        }

        .bk {
            padding-left: 22px;
            margin: 10px 0
        }

        .bk li {
            margin: 8px 0
        }

        .bk .row input {
            flex: 1
        }

        .task .chip {
            white-space: nowrap
        }

        .stuckbtn {
            width: 100%;
            padding: 16px;
            font-weight: 700;
            margin: 0 0 14px;
            border-radius: 22px
        }

        .opts {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr
        }

        .opt {
            display: flex;
            gap: 10px;
            align-items: center;
            text-align: left;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--card);
            line-height: 1.3
        }

        .opt span {
            font-size: 1.4rem
        }

        .opt:last-child {
            grid-column: 1/-1
        }

        .opt:hover {
            border-color: var(--acc)
        }

        @media(max-width:340px) {
            .opts {
                grid-template-columns: 1fr
            }
        }

        .duo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px
        }

        .duo .stuckbtn {
            margin: 0
        }

        .duo .btn {
            white-space: normal
        }

        .rescue {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--bg);
            background-image: var(--g);
            display: grid;
            place-content: center;
            text-align: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
            overflow: auto
        }

        .rescue>div {
            width: min(560px, 92vw)
        }

        .rescue h1 {
            margin: .2em 0
        }

        .rq {
            font: 700 clamp(1.3rem, 4.5vw, 1.9rem)/1.3 'DM Sans', sans-serif;
            margin: 14px 0 20px
        }

        .rform {
            display: flex;
            gap: 8px;
            margin: 14px 0
        }

        .rform input {
            flex: 1
        }

        .rescue .ringbox {
            width: min(300px, 72vw)
        }

        .rans {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px 14px;
            margin: 12px 0;
            text-align: left
        }

        .mom,
        .mom4 {
            display: grid;
            gap: 8px;
            text-align: center
        }

        .mom {
            grid-template-columns: repeat(3, 1fr)
        }

        .mom4 {
            grid-template-columns: repeat(4, 1fr)
        }

        .mom b,
        .mom4 b {
            display: block;
            font: 700 1.4rem 'DM Sans', sans-serif
        }

        .mom span,
        .mom4 span {
            font-size: .85rem
        }

        .sel {
            width: auto;
            padding: 2px 6px;
            border-radius: 10px
        }

        .top {
            text-align: right
        }

        .t-week {
            max-width: 720px
        }

        .fab.cap {
            bottom: calc(148px + env(safe-area-inset-bottom, 0px));
            background: var(--card);
            color: var(--ink);
            border: 1px solid var(--line);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: none;
            padding: 10px 16px;
            font-size: .9rem
        }

        nav .dsk {
            display: none
        }

        @media(min-width:900px) {
            .top {
                display: none
            }

            nav .dsk {
                display: block
            }

            .fab.cap {
                bottom: 92px
            }
        }

        .hero {
            text-align: center;
            padding: 4px 0
        }

        .wm {
            font: 700 .9rem 'DM Sans', sans-serif;
            letter-spacing: .35em;
            color: var(--acc);
            margin: 0
        }

        .hi {
            font: 700 clamp(1.6rem, 5vw, 2.3rem) 'DM Sans', sans-serif;
            margin: .15em 0
        }

        .hero svg {
            width: min(300px, 80%);
            display: block;
            margin: 4px auto
        }

        .pt {
            fill: none;
            stroke: var(--line);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pf {
            fill: none;
            stroke: url(#hg);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pf.gl {
            filter: url(#glw);
            opacity: .75;
            stroke-width: 9
        }

        .hero svg text {
            font: 600 11px 'DM Sans', sans-serif;
            fill: var(--mute)
        }

        .nm {
            font: 700 1.3rem 'DM Sans', sans-serif;
            margin: 2px 0 12px
        }

        .flow {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center
        }

        .fn {
            border: 1.5px solid var(--acc);
            border-radius: 14px;
            padding: 8px 12px;
            font-weight: 600
        }

        .fa {
            color: var(--acc);
            font-weight: 700
        }

        .why {
            margin: 10px 0
        }

        .why input {

            all("[data-itk]", b => { const x = byId(S.ideas, b.dataset.itk), tk = { id: Date.now(), t: x.next, time: hhmm(Math.ceil((nowM() + 10) / 15) * 15), dur: 30, done: false, pri: "med", due: "", post: 0, lk: "" }; S.tasks.push(tk); logEv("add", tk); save(); b.textContent = "Added to today ✓" });
            all("[data-ido]", b => { const x = byId(S.ideas, b.dataset.ido); x.asked = Date.now(); S.seen.idea = Date.now(); tab = "grow"; gsub = "ideas"; save(); render(); scrollTo(0, 0) });
            all("[data-idl]", b => { const x = byId(S.ideas, b.dataset.idl); x.asked = Date.now(); S.seen.idea = Date.now(); save(); render() });
            chg("#aip", t => { S.ai.prov = t.value; S.ai.model = ""; save(); render() });
            chg("#aik", t => { S.ai.key = t.value.trim(); save() }); chg("#aim", t => { S.ai.model = t.value.trim(); save() }); chg("#aib", t => { S.ai.base = t.value.trim(); save() });
            on("#ais", () => { S.ai.share = S.ai.share === false; save(); render() });
            on("#ait", async () => { const o = $("#aiout"); o.textContent = "Testing…"; try { const r = await llm("Reply with a friendly five-word greeting.", true); o.textContent = "Connected. " + r.trim().slice(0, 100) } catch (e) { o.textContent = "Failed: " + e.message } });
            on("#wsn", () => { skip = []; pick = suggest(skip); render() });
            on("#pst", () => { if (pick.rev) S.seen.rev = dayKey(Date.now()); fdur = pick.mins; left = fdur * 60; focusTask = pick.id || null; focusLabel = pick.label || ""; tab = "focus"; pick = null; if (timer) { clearInterval(timer); timer = null } startFocus(); scrollTo(0, 0) });
            on("#pdn", () => { const t = S.tasks.find(x => x.id === pick.id); if (t) markDone(t); save(); pick = suggest(skip); render() });
            on("#pnw", () => { const t = S.tasks.find(x => x.id === pick.id); if (t) { t.post = (t.post || 0) + 1; logEv("post", t); skip.push(t.id); save() } pick = suggest(skip); render() });
            on("#pad", () => { const d = new Date(); logEv("add", { id: 0, t: pick.label, time: "", dur: 25 }); S.tasks.push({ id: Date.now(), t: pick.label, time: String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"), dur: 25, done: false, pri: "med", post: 0, lk: pick.lk || "" }); save(); pick = null; render() });
            on("#gc", () => { S.goal = ""; save(); render() });
            const f = $("#f"); if (f) f.onsubmit = e => { e.preventDefault(); const v = $("#in").value; send(v) };
            const mf = $("#mf"); if (mf) mf.onsubmit = e => { e.preventDefault(); const v = $("#mi").value.trim(); if (v && S.memOn && !S.off.includes($("#mc").value)) { S.mem.push({ id: Date.now(), k: $("#mc").value, v, why: "You added it yourself" }); save(); render() } };
            const c = $("#chat"); if (c && c.lastChild) c.lastChild.scrollIntoView({ block: "nearest" })
        }
        render();
    </script>
</body>

</html>
