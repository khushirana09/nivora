<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nivora — your AI mentor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f1f2fb;
            --card: rgba(255, 255, 255, .72);
            --ink: #1b2144;
            --mute: #5d6486;
            --acc: #5b4ee8;
            --acc2: #2bb8a8;
            --line: rgba(27, 33, 68, .1);
            --g: radial-gradient(900px 500px at 0% -10%, #d9d4ff, transparent), radial-gradient(700px 500px at 100% 0%, #c9f1ec, transparent);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1330;
                --card: rgba(255, 255, 255, .07);
                --ink: #eceeff;
                --mute: #9aa1c9;
                --acc: #8f84ff;
                --acc2: #52d6c6;
                --line: rgba(255, 255, 255, .12);
                --g: radial-gradient(900px 500px at 0% -10%, #2a2470, transparent), radial-gradient(700px 500px at 100% 0%, #0f4b53, transparent)
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1330;
            --card: rgba(255, 255, 255, .07);
            --ink: #eceeff;
            --mute: #9aa1c9;
            --acc: #8f84ff;
            --acc2: #52d6c6;
            --line: rgba(255, 255, 255, .12);
            --g: radial-gradient(900px 500px at 0% -10%, #2a2470, transparent), radial-gradient(700px 500px at 100% 0%, #0f4b53, transparent)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            background-image: var(--g);
            background-attachment: fixed;
            color: var(--ink);
            font: 16px/1.55 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh
        }

        main {
            max-width: 1080px;
            margin: auto;
            padding: 20px clamp(14px, 4vw, 32px) 110px
        }

        h1 {
            font-size: clamp(1.7rem, 4.5vw, 2.6rem);
            line-height: 1.1;
            margin: .2em 0 .3em;
            font-weight: 800;
            letter-spacing: -.02em
        }

        h2 {
            font-size: 1.1rem;
            margin: 0 0 10px
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 16px;
            margin: 14px 0
        }

        .mute {
            color: var(--mute)
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .sp {
            justify-content: space-between
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        .btn {
            background: var(--acc);
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 600
        }

        .btn.alt {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line)
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--acc2);
            outline-offset: 2px
        }

        input,
        select {
            font: inherit;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 12px;
            width: 100%
        }

        .bar {
            height: 10px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--acc), var(--acc2));
            transition: width .5s
        }

        .task {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--line)
        }

        .task:first-of-type {
            border-top: 0
        }

        .chk {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--acc);
            background: none;
            flex: none
        }

        .done .chk {
            background: var(--acc2);
            border-color: var(--acc2)
        }

        .done b {
            text-decoration: line-through;
            opacity: .55
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid var(--line)
        }

        nav button {
            flex: 1;
            max-width: 110px;
            background: none;
            border: 0;
            border-radius: 14px;
            padding: 8px 4px;
            color: var(--mute);
            font-size: .82rem
        }

        nav button[aria-current=true] {
            color: var(--acc);
            background: var(--line);
            font-weight: 600
        }

        .orb {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 20px auto;
            border: 0;
            background: radial-gradient(circle at 35% 30%, #fff9, transparent 40%), linear-gradient(135deg, var(--acc), var(--acc2));
            box-shadow: 0 0 60px var(--acc);
            color: #fff;
            font-weight: 800;
            font-size: 1rem
        }

        .orb.on {
            animation: p 1.2s ease-in-out infinite
        }

        @keyframes p {
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 100px var(--acc2)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .orb.on {
                animation: none
            }
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            margin: 8px 0;
            white-space: pre-wrap
        }

        .me {
            margin-left: auto;
            background: var(--acc);
            color: #fff
        }

        .ai {
            background: var(--card);
            border: 1px solid var(--line)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: .88rem
        }

        .big {
            font-size: 3.4rem;
            font-weight: 800;
            text-align: center;
            font-variant-numeric: tabular-nums
        }

        .step {
            padding: 8px 0 8px 18px;
            border-left: 3px solid var(--acc2);
            margin-left: 6px
        }

        .step.d {
            border-color: var(--acc)
        }

        .sw {
            display: flex;
            gap: 8px;
            align-items: center
        }

        h1,
        h2,
        .big,
        .orb,
        nav button,
        .brand {
            font-family: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif
        }

        .btn,
        .me,
        .chip[aria-pressed=true] {
            color: var(--onacc, #fff)
        }

        .chip[aria-pressed=true] {
            background: var(--acc);
            border-color: var(--acc)
        }

        .sw {
            flex-wrap: wrap
        }

        .swb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid transparent;
            padding: 0
        }

        .swb[aria-pressed=true] {
            border-color: var(--ink)
        }

        .cols {
            display: grid;
            gap: 0 16px
        }

        .cols>.btn {
            grid-column: 1/-1
        }

        .brand {
            display: none;
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--acc);
            padding: 6px 14px 18px
        }

        label.mute {
            display: block;
            margin: 10px 0 4px;
            font-size: .9rem
        }

        @media(min-width:760px) {
            .cols {
                grid-template-columns: 1fr 1fr;
                align-items: start
            }
        }

        @media(min-width:900px) {
            nav {
                left: 0;
                right: auto;
                top: 0;
                bottom: 0;
                width: 220px;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                padding: 24px 14px;
                border-top: 0;
                border-right: 1px solid var(--line)
            }

            nav button {
                max-width: none;
                flex: none;
                text-align: left;
                padding: 12px 14px;
                font-size: .95rem
            }

            .brand {
                display: block
            }

            main {
                margin-left: 220px;
                max-width: none;
                padding: 32px 40px
            }

            .wrap {
                max-width: 980px;
                margin: auto
            }
        }

        .t-mentor,
        .t-goals,
        .t-focus,
        .t-settings {
            max-width: 720px
        }

        @media(max-width:400px) {
            nav button {
                font-size: .68rem;
                padding: 8px 1px
            }
        }

        .wrap {
            margin-inline: auto;
            width: 100%
        }

        .btn {
            white-space: nowrap
        }

        .t-mentor,
        .t-focus {
            text-align: center
        }

        .t-mentor .msg {
            text-align: left
        }

        .t-mentor h1 {
            margin-top: 0
        }

        .orbwrap {
            position: relative;
            display: grid;
            place-items: center;
            height: 250px
        }

        .orb {
            display: grid;
            place-items: center;
            margin: 0;
            width: 160px;
            height: 160px;
            position: relative;
            z-index: 1
        }

        .ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 1.5px solid var(--acc);
            opacity: .3
        }

        .r1 {
            transform: scale(1.4)
        }

        .r2 {
            transform: scale(1.8);
            opacity: .15
        }

        .orbwrap.on .ring {
            animation: rg 2.6s ease-out infinite
        }

        .orbwrap.on .r2 {
            animation-delay: 1.3s
        }

        @keyframes rg {
            from {
                transform: scale(1);
                opacity: .5
            }

            to {
                transform: scale(2.1);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .orbwrap.on .ring {
                animation: none
            }
        }

        .status {
            color: var(--mute);
            margin: 0 0 14px
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 14px;
            min-height: 130px;
            max-height: 320px;
            overflow: auto;
            margin: 0 0 14px;
            text-align: left
        }

        .tf {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px
        }

        .tf input:first-child {
            flex: 1 1 100%
        }

        .tf input[type=time],
        .tf input[type=number] {
            width: auto;
            flex: 1 1 90px
        }

        .ringbox {
            position: relative;
            width: min(260px, 70vw);
            margin: 14px auto
        }

        .ringbox svg {
            width: 100%;
            display: block
        }

        .trk {
            fill: none;
            stroke: var(--line);
            stroke-width: 12
        }

        .prg {
            fill: none;
            stroke: url(#gr);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear
        }

        .ringtxt {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            font: 800 clamp(2.4rem, 9vw, 3.3rem) 'Sora', sans-serif;
            font-variant-numeric: tabular-nums
        }

        .ringtxt small {
            font: 500 .85rem 'Plus Jakarta Sans', sans-serif;
            color: var(--mute)
        }

        .stat {
            text-align: center;
            display: grid
        }

        .stat b {
            font: 800 2.2rem 'Sora', sans-serif;
            color: var(--acc)
        }

        .giant {
            display: block;
            width: 100%;
            padding: 28px 20px;
            font: 700 clamp(1.2rem, 4vw, 1.6rem) 'Sora', sans-serif;
            border-radius: 28px;
            margin: 18px 0;
            box-shadow: 0 16px 44px -14px var(--acc)
        }

        .move {
            border-color: var(--acc)
        }

        .mv {
            font: 700 clamp(1.25rem, 3.6vw, 1.6rem)/1.3 'Sora', sans-serif;
            margin: 6px 0
        }

        .tf select,
        .tf input[type=date] {
            width: auto;
            flex: 1 1 110px
        }

        .fab {
            position: fixed;
            right: 16px;
            bottom: calc(84px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            display: flex;
            gap: 8px;
            align-items: center;
            border: 0;
            border-radius: 999px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            color: var(--onacc, #fff);
            font: 700 1rem 'Sora', sans-serif;
            box-shadow: 0 12px 30px -8px var(--acc)
        }

        [hidden] {
            display: none !important
        }

        @media(min-width:900px) {
            .fab {
                bottom: 28px;
                right: 32px
            }
        }

        .t-me .cols {
            margin-top: 0
        }

        .gpath {
            padding: 14px 0;
            border-top: 1px solid var(--line)
        }

        .gpath:first-of-type {
            border-top: 0
        }

        .path {
            list-style: none;
            margin: 10px 0;
            padding: 0;
            text-align: left
        }

        .path li {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 0
        }

        .path li:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 12px;
            top: 30px;
            bottom: -9px;
            width: 2px;
            background: var(--line)
        }

        .path .dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--acc);
            background: var(--bg);
            padding: 0;
            flex: none;
            position: relative;
            z-index: 1;
            display: block
        }

        .path span {
            flex: 1
        }

        .path .d .dot {
            background: var(--acc2);
            border-color: var(--acc2)
        }

        .path .d span {
            opacity: .55;
            text-decoration: line-through
        }

        .path .c .dot {
            background: var(--acc);
            box-shadow: 0 0 0 5px var(--line)
        }

        .path em {
            font-style: normal;
            font-size: .8rem;
            font-weight: 700;
            color: var(--acc)
        }

        .path .fin {
            color: var(--mute);
            font-family: 'Sora', sans-serif
        }

        textarea {
            font: inherit;
            color: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 12px;
            width: 100%;
            resize: vertical
        }

        .fcard {
            border-color: var(--acc)
        }

        .fq {
            font: 600 1.1rem/1.45 'Sora', sans-serif;
            margin: 8px 0
        }

        .fgrid {
            gap: 0 24px;
            margin-top: 6px
        }

        .fgrid h3 {
            font: 700 .95rem 'Sora', sans-serif;
            color: var(--acc);
            margin: 14px 0 4px
        }

        .fit {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-top: 1px solid var(--line)
        }

        .fm {
            color: var(--acc);
            font-weight: 600;
            margin: 6px 0
        }

        .chain {
            list-style: none;
            margin: 10px 0;
            padding: 0;
            text-align: left
        }

        .chain li {
            position: relative;
            padding: 0 0 8px 20px
        }

        .chain li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: .5em;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--acc)
        }

        .chain li:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 1.4em;
            bottom: -.2em;
            width: 2px;
            background: var(--line)
        }

        .chain small {
            color: var(--mute);
            margin-right: 6px
        }

        .chain li:last-child {
            font-weight: 700
        }

        .t-focus .chain {
            display: inline-block
        }

        .path .ms {
            margin-left: 36px;
            padding: 4px 0
        }

        .path .ms::before {
            display: none
        }

        .path .ms .dot {
            width: 18px;
            height: 18px
        }

        .tf select#tl {
            flex: 1 1 100%
        }

        .bk {
            padding-left: 22px;
            margin: 10px 0
        }

        .bk li {
            margin: 8px 0
        }

        .bk .row input {
            flex: 1
        }

        .task .chip {
            white-space: nowrap
        }

        .stuckbtn {
            width: 100%;
            padding: 16px;
            font-weight: 700;
            margin: 0 0 14px;
            border-radius: 22px
        }

        .opts {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr
        }

        .opt {
            display: flex;
            gap: 10px;
            align-items: center;
            text-align: left;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--card);
            line-height: 1.3
        }

        .opt span {
            font-size: 1.4rem
        }

        .opt:last-child {
            grid-column: 1/-1
        }

        .opt:hover {
            border-color: var(--acc)
        }

        @media(max-width:340px) {
            .opts {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>
    <nav id="nav"></nav>
    <button id="fab" class="fab" hidden></button>
    <script>
        const $ = s => document.querySelector(s);
        const defaults = { name: "", mentor: "Nivora", theme: { pal: 0, mode: "auto" }, memOn: true, tasks: [], mem: [], chat: [], focusMin: 0, sessions: 0, goal: "", goals: [] };
        let S; try { S = JSON.parse(localStorage.getItem("nivora2")) || defaults } catch (e) { S = defaults }
        const save = () => { try { cascade() } catch (e) { } try { localStorage.setItem("nivora2", JSON.stringify(S)) } catch (e) { } };
        const AREAS = ["Career", "Health", "Learning", "Finance", "Personal"];
        function ensureLife() { if (!S.off) S.off = []; if (!S.future) S.future = { text: "", items: [], at: 0 }; if (!S.life) { S.life = {}; AREAS.forEach(a => S.life[a] = []); if (S.goal) S.life.Career.push({ id: 1, t: S.goal, steps: S.goals || [] }); S.goal = ""; S.goals = [] } AREAS.forEach(a => S.life[a].forEach(g => g.steps.forEach(st => { if (!st[2]) st[2] = []; if (!st[3]) st[3] = uid() }))) }
        function uid() { return Date.now() + Math.floor(Math.random() * 1e6) }
        ensureLife();
        const lifeGoals = () => AREAS.flatMap(a => S.life[a].map(g => g.t + " (" + a + ")"));
        function nextStep() { for (const a of AREAS) for (const g of S.life[a]) { const j = g.steps.findIndex(x => !x[1]); if (j > -1) { const st = g.steps[j], m = (st[2] || []).find(x => !x[1]); return { a, g, j, s: m ? m[0] : st[0], lk: g.id + ":" + st[3] + (m ? ":" + m[2] : "") } } } return null }
        let area = "Career";
        if (!S.off) S.off = []; S.mem.forEach(m => { if (m.k === "Goal") m.k = "Goals"; if (m.k === "Note") m.k = "Notes" });
        if (!S.theme) S.theme = { pal: 0, mode: "auto" }; if (S.mentor === "Nova") S.mentor = "Nivora";
        const PAL = [{ n: "Aurora", a: ["#5b4ee8", "#8f84ff"], b: ["#2bb8a8", "#52d6c6"], g: [["#d9d4ff", "#c9f1ec"], ["#2a2470", "#0f4b53"]] }, { n: "Ocean", a: ["#0b6fd6", "#5aa9ff"], b: ["#12b5cb", "#4fd8ea"], g: [["#cfe6ff", "#c8f3f8"], ["#0c2f5c", "#0b4452"]] }, { n: "Sunset", a: ["#d94a30", "#ff8a6b"], b: ["#e8962a", "#ffc46b"], g: [["#ffd9cf", "#ffecc9"], ["#5a2216", "#5a3c10"]] }, { n: "Forest", a: ["#2f8a4f", "#6fd08c"], b: ["#8fae2f", "#c4de6b"], g: [["#d3f0dc", "#eaf2c6"], ["#133a22", "#33410f"]] }, { n: "Rose", a: ["#d6336c", "#ff7aa8"], b: ["#9c5be8", "#c39bff"], g: [["#ffd6e4", "#e8d9ff"], ["#5a1230", "#3a1a63"]] }, { n: "Graphite", a: ["#3b4252", "#aeb7cc"], b: ["#6b7a99", "#8795b8"], g: [["#e3e6ee", "#d7dbe6"], ["#262b38", "#1b1f2b"]] }];
        function applyTheme() { const t = S.theme, p = PAL[t.pal] || PAL[0], d = t.mode === "dark" || (t.mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches), r = document.documentElement, i = d ? 1 : 0, y = r.style; r.dataset.theme = d ? "dark" : "light"; y.setProperty("--acc", p.a[i]); y.setProperty("--acc2", p.b[i]); y.setProperty("--onacc", d ? "#10122b" : "#fff"); y.setProperty("--g", "radial-gradient(900px 500px at 0% -10%," + p.g[i][0] + ",transparent),radial-gradient(700px 500px at 100% 0%," + p.g[i][1] + ",transparent)") }
        try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme) } catch (e) { }

            a.querySelectorAll("[data-ma]").forEach(b => b.onclick = () => { const x = S.chat[+b.dataset.ma].act; try { speechSynthesis.cancel() } catch (e) { } fdur = x.mins; left = fdur * 60; focusTask = x.id || null; focusLabel = x.label || ""; tab = "focus"; if (timer) { clearInterval(timer); timer = null } startFocus(); scrollTo(0, 0) });
            a.querySelectorAll("[data-me]").forEach(b => b.onclick = () => { const m = S.mem.find(x => x.id == b.dataset.me), v = prompt("Edit memory", m.v); if (v && v.trim()) { m.v = v.trim(); save(); render() } });
            a.querySelectorAll("[data-ca]").forEach(b => b.onclick = () => { const c = b.dataset.ca; S.off = S.off.includes(c) ? S.off.filter(x => x !== c) : S.off.concat(c); save(); render() });
            a.querySelectorAll("[data-area]").forEach(b => { const f = () => { area = b.dataset.area; render() }; b.onclick = f; b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f() } } });
            const gg = id => S.life[area].find(g => g.id == id);
            sub("#lgf", () => { const t = $("#lgi").value.trim(); if (t) S.life[area].push({ id: Date.now(), t, steps: [] }) });
            a.querySelectorAll(".lsf").forEach(f => f.onsubmit = e => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if (v) { gg(f.dataset.gid).steps.push([v, 0, [], uid()]); save(); render() } });
            a.querySelectorAll("[data-ls]").forEach(b => b.onclick = () => { const [i, j] = b.dataset.ls.split(":"), st = gg(i).steps[+j]; st[1] = st[1] ? 0 : 1; save(); render() });
            a.querySelectorAll("[data-lx]").forEach(b => b.onclick = () => { const [i, j] = b.dataset.lx.split(":"); gg(i).steps.splice(+j, 1); save(); render() });
            a.querySelectorAll("[data-lgx]").forEach(b => b.onclick = () => { if (confirm("Remove this goal and its steps?")) { S.life[area] = S.life[area].filter(g => g.id != b.dataset.lgx); save(); render() } });
            sub("#ff", () => { const t = $("#ft").value.trim(); if (t) S.future = { text: t, at: Date.now(), items: parseFuture(t) } });
            sub("#fif", () => { const v = $("#fi").value.trim(); if (v) S.future.items.push({ id: Date.now(), k: $("#fc").value, v }) });
            a.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => { S.future.items = S.future.items.filter(i => i.id != b.dataset.fx); save(); render() });
            on("#fre", () => { if (confirm("Rewrite your vision? Your current areas will be replaced.")) { S.future = { text: "", items: [], at: 0, draft: S.future.text }; save(); render() } });
            a.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { planLk = b.dataset.plan; tab = "home"; render(); scrollTo(0, 0); setTimeout(() => { const e = $("#tt"); if (e) e.focus() }, 0) });
            a.querySelectorAll("[data-msadd]").forEach(b => b.onclick = () => { const [i, j] = b.dataset.msadd.split(":"), v = prompt("Milestone name (for example: Hooks)"); if (v && v.trim()) { const st = gg(i).steps[+j]; (st[2] = st[2] || []).push([v.trim(), 0, uid()]); save(); render() } });
            a.querySelectorAll("[data-mt]").forEach(b => b.onclick = () => { const [i, j, k] = b.dataset.mt.split(":"), m = gg(i).steps[+j][2][+k]; m[1] = m[1] ? 0 : 1; save(); render() });
            a.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => { const [i, j, k] = b.dataset.mx.split(":"); gg(i).steps[+j][2].splice(+k, 1); save(); render() });
            const syncBk = () => { const ins = [...document.querySelectorAll(".bk-in")]; if (ins.length && brk) brk.steps = ins.map(i => i.value) };
            on("#bkgo", () => { brk.stage = "edit"; render() }); on("#bkno", () => { brk = null; render() });
            on("#bkadd", () => { syncBk(); brk.steps.push(""); render(); setTimeout(() => { const x = [...document.querySelectorAll(".bk-in")].pop(); if (x) x.focus() }, 0) });
            a.querySelectorAll("[data-bkx]").forEach(b => b.onclick = () => { syncBk(); brk.steps.splice(+b.dataset.bkx, 1); render() });
            a.querySelectorAll("[data-bd]").forEach(b => b.onclick = () => { const t = S.tasks.find(x => x.id == b.dataset.bd); brk = { taskId: t.id, title: t.t, steps: breakdown(t.t), stage: "edit" }; render(); scrollTo(0, 0) });
            on("#bka", () => {
                syncBk(); const st = brk.steps.map(x => x.trim()).filter(Boolean); if (!st.length) return; const o = S.tasks.find(t => t.id === brk.taskId), n = st.length, d = o ? Math.min(60, Math.max(15, Math.round(o.dur / n / 5) * 5)) : 25, t0 = Date.now(); let at = o ? tm(o) : nowM();
                const ts = st.map((x, i) => { const t = { id: t0 + i, t: x, time: hhmm(at), dur: d, done: false, pri: o ? o.pri : "med", due: o ? o.due : "", post: 0, lk: o ? o.lk : "", grp: brk.title, gi: i + 1, gn: n }; at += d; return t });
                if (o) S.tasks = S.tasks.filter(t => t.id !== o.id); S.tasks.push(...ts); brk = null; save(); render()
            });
            a.querySelectorAll("[data-sk]").forEach(b => b.onclick = () => { const k = b.dataset.sk; stuck = { stage: "res", said: STK.find(o => o[2] === k)[1], ...stuckResp(k) }; render(); scrollTo(0, 0) });
            on("#stk", () => { stuck = { stage: "ask" }; render(); scrollTo(0, 0) }); on("#stk2", () => { stuck = { stage: "ask" }; tab = "home"; render(); scrollTo(0, 0) }); on("#stkx", () => { stuck = null; render() }); on("#stkb", () => { stuck = { stage: "ask" }; render() });
            a.querySelectorAll("[data-sa]").forEach(b => b.onclick = () => {
                const x = stuck.acts[+b.dataset.sa], t = S.tasks.find(y => y.id === stuck.tid);
                if (x.f === "focus") { fdur = x.mins; left = fdur * 60; focusTask = x.id || null; focusLabel = x.label || ""; stuck = null; tab = "focus"; if (timer) { clearInterval(timer); timer = null } startFocus(); scrollTo(0, 0) }
                else if (x.f === "break" && t) { brk = { taskId: t.id, title: t.t, steps: breakdown(t.t), stage: "edit" }; stuck = null; render() }
                else if (x.f === "later" && t) { t.time = hhmm(Math.max(tm(t), nowM()) + 120); t.post = (t.post || 0) + 1; save(); stuck = { stage: "note", msg: "Moved \"" + t.t + "\" to " + t.time + ". No guilt, it's just a new plan." }; render() }
                else if (x.f === "shorten" && t) { t.dur = x.n; save(); stuck = { stage: "note", msg: "Shortened \"" + t.t + "\" to " + x.n + " minutes. Small and doable." }; render() }
                else if (x.f === "talk") { stuck = null; tab = "mentor"; render(); scrollTo(0, 0); listen() }
            });
            on("#wsn", () => { skip = []; pick = suggest(skip); render() });
            on("#pst", () => { fdur = pick.mins; left = fdur * 60; focusTask = pick.id || null; focusLabel = pick.label || ""; tab = "focus"; pick = null; if (timer) { clearInterval(timer); timer = null } startFocus(); scrollTo(0, 0) });
            on("#pdn", () => { const t = S.tasks.find(x => x.id === pick.id); if (t) t.done = true; save(); pick = suggest(skip); render() });
            on("#pnw", () => { const t = S.tasks.find(x => x.id === pick.id); if (t) { t.post = (t.post || 0) + 1; skip.push(t.id); save() } pick = suggest(skip); render() });
            on("#pad", () => { const d = new Date(); S.tasks.push({ id: Date.now(), t: pick.label, time: String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"), dur: 25, done: false, pri: "med", post: 0, lk: pick.lk || "" }); save(); pick = null; render() });
            on("#gc", () => { S.goal = ""; save(); render() });
            const f = $("#f"); if (f) f.onsubmit = e => { e.preventDefault(); const v = $("#in").value; send(v) };
            const mf = $("#mf"); if (mf) mf.onsubmit = e => { e.preventDefault(); const v = $("#mi").value.trim(); if (v && S.memOn && !S.off.includes($("#mc").value)) { S.mem.push({ id: Date.now(), k: $("#mc").value, v, why: "You added it yourself" }); save(); render() } };
            const c = $("#chat"); if (c && c.lastChild) c.lastChild.scrollIntoView({ block: "nearest" })
        }
        render();
    </script>
</body>

</html>
